# Site settings
locale: "en-US"
title: "Yuntian Gao"
title_separator: "-"
name: "Yuntian Gao"
description: "Personal website and notes by Yuntian Gao."
url: "https://yuntian-gao.github.io"
baseurl: ""
repository: "Yuntian-Gao/Yuntian-Gao.github.io"

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "default"
search: false

# Site author
author:
  name: "Yuntian Gao"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Personal website."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Yuntian-Gao"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Yuntian-Gao"
  since: "2026"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
timezone: "Asia/Shanghai"

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
