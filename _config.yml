# Site settings
locale: "en-US"
title: "Yuntian Gao"
title_separator: "-"
name: "Yuntian Gao"
description: "Yuntian Gao's academic homepage: 3D computer vision and world models."
url: "https://yuntian-gao.github.io"
baseurl: ""
repository: "Yuntian-Gao/Yuntian-Gao.github.io"

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "default"
search: false

atom_feed:
  hide: true

# Site author
author:
  name: "Yuntian Gao"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "M.Eng. student at XJTU. Researching 3D computer vision and world models."
  location: "Xi'an, China"
  links:
    - label: "Xi'an Jiaotong University"
      icon: "fas fa-fw fa-building-columns"
      url: "https://en.xjtu.edu.cn/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Yuntian-Gao"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Yuntian-Gao"
  since: "2026"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
timezone: "Asia/Shanghai"

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
